services:
  - type: web
    name: bi-analytics-producao
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_PROVIDER
        value: demo
      - key: AI_PROVIDER
        value: none
      - key: SECRET_KEY
        generateValue: true
